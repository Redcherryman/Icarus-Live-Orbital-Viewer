# ICARUS-OV release builder
# Triggers on version tags (v*). Builds the self-contained application image
# for Windows, Linux and macOS, and uploads the archives as release artifacts.
#
# Apache-2.0 :: Copyright 2026 Aiden Joshua-Steven Scoggins (Aiden J.S. Scoggins)

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build fat jar + run tests
        run: gradle test fatJar --no-daemon

      - name: Build application image
        run: gradle packageApp --no-daemon

      - name: Archive application image
        shell: bash
        run: |
          mkdir -p dist
          tar -a -c -f "dist/ICARUS-OV-${{ matrix.os }}.zip" -C build/installer ICARUS-OV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ICARUS-OV-${{ matrix.os }}
          path: dist/ICARUS-OV-${{ matrix.os }}.zip
          if-no-files-found: error
