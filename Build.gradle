plugins {
    id 'java'
    id 'application'
}

group   = 'com.icarus_ov'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    // Compile with whatever JDK is on PATH (here: 26) but target Java 21
    // bytecode so the packaged app runs on any Java 21+ runtime.
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    // Detect the current OS to pull the correct JavaFX platform-flavoured
    // artifact (the plain "org.openjfx:*" jars are POM-only and empty).
    def os = System.getProperty('os.name').toLowerCase()
    def fxPlatform = os.contains('win') ? 'win'
            : (os.contains('mac') ? 'mac' : 'linux')

    // JavaFX (graphics contains the 3D scene graph)
    implementation "org.openjfx:javafx-base:21.0.5:${fxPlatform}"
    implementation "org.openjfx:javafx-graphics:21.0.5:${fxPlatform}"
    implementation "org.openjfx:javafx-controls:21.0.5:${fxPlatform}"

    // JSON parsing (NASA / CelesTrak payloads)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    // SGP4 orbital propagation (Orekit, Apache-2.0). Used to turn the
    // fetched TLE elements into live positions/altitudes/ground tracks.
    implementation 'org.orekit:orekit:12.1.1'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    // Plain (non-JavaFX) launcher class to stay on the classpath and
    // avoid JavaFX "runtime components are missing" module-path errors.
    mainClass = 'com.icarus_ov.Launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Single self-contained jar for easy java -jar launching.
tasks.register('fatJar', Jar) {
    archiveClassifier.set('all')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'com.icarus_ov.Launcher' }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

build.dependsOn tasks.named('fatJar')

// ---------------------------------------------------------------------------
// Native packaging with jpackage (bundles a JRE: users need no Java install).
// ---------------------------------------------------------------------------

// Locate the jpackage launcher from the JDK running this build.
def jdk = System.getProperty('java.home')
def jpackageExe = file("${jdk}/bin/jpackage.exe").isFile()
        ? "${jdk}/bin/jpackage.exe"
        : (file("${jdk}/bin/jpackage").isFile() ? "${jdk}/bin/jpackage" : null)

def pkg = [
        '--input', 'build/libs',
        '--main-jar', "Icarus-OV-${project.version}-all.jar",
        '--main-class', 'com.icarus_ov.Launcher',
        '--name', 'ICARUS-OV',
        '--app-version', "${project.version}",
        '--description',
        'Live orbital tracking viewer powered by public NASA data. Retro 1980s-90s CRT interface.',
        '--copyright', 'Copyright 2026 Aiden Joshua-Steven Scoggins',
        '--license-file', 'LICENSE',
        '--dest', 'build/installer',
]

// Self-contained application image (portable folder, runnable on any machine).
tasks.register('packageApp', Exec) {
    dependsOn tasks.named('fatJar')
    enabled = jpackageExe != null
    commandLine([jpackageExe] + pkg + ['--type', 'app-image'])
    doFirst { delete 'build/installer' }
}

// Native Windows MSI installer (requires the WiX Toolset on PATH).
tasks.register('packageMsi', Exec) {
    dependsOn tasks.named('fatJar')
    enabled = jpackageExe != null
    commandLine([jpackageExe] + pkg + ['--type', 'msi', '--win-menu', '--win-shortcut'])
    doFirst { delete 'build/installer' }
}

// Linux Debian/RPM installers (generated on Linux machines).
tasks.register('packageLinux', Exec) {
    dependsOn tasks.named('fatJar')
    enabled = jpackageExe != null
    commandLine([jpackageExe] + pkg + ['--type', 'deb'])
    doFirst { delete 'build/installer' }
}
