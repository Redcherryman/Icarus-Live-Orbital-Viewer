plugins {
    id 'java'
    id 'application'
}

group   = 'com.icarus_ov'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    // Compile with whatever JDK is on PATH (here: 26) but target Java 21
    // bytecode so the packaged app runs on any Java 21+ runtime.
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    // Detect the current OS to pull the correct JavaFX platform-flavoured
    // artifact (the plain "org.openjfx:*" jars are POM-only and empty).
    def os = System.getProperty('os.name').toLowerCase()
    def fxPlatform = os.contains('win') ? 'win'
            : (os.contains('mac') ? 'mac' : 'linux')

    // JavaFX (graphics contains the 3D scene graph)
    implementation "org.openjfx:javafx-base:21.0.5:${fxPlatform}"
    implementation "org.openjfx:javafx-graphics:21.0.5:${fxPlatform}"
    implementation "org.openjfx:javafx-controls:21.0.5:${fxPlatform}"

    // JSON parsing (NASA / CelesTrak payloads)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    // Plain (non-JavaFX) launcher class to stay on the classpath and
    // avoid JavaFX "runtime components are missing" module-path errors.
    mainClass = 'com.icarus_ov.Launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Single self-contained jar for easy java -jar launching.
tasks.register('fatJar', Jar) {
    archiveClassifier.set('all')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'com.icarus_ov.Launcher' }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

build.dependsOn tasks.named('fatJar')
